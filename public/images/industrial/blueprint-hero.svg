<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t">
  <title id="t">Design blueprint of a desk companion robot, front and side views with dimensions</title>
  <defs>
    <pattern id="fine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#3d6fb8" stroke-width="0.6" opacity="0.35"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#fine)"/>
      <path d="M100 0H0V100" fill="none" stroke="#5a8ad6" stroke-width="1.1" opacity="0.4"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#cfe1ff"/>
    </marker>
  </defs>

  <rect width="1400" height="800" fill="#0e1f3a"/>
  <rect width="1400" height="800" fill="url(#grid)"/>

  <!-- FRONT VIEW -->
  <g fill="none" stroke="#e9f1ff" stroke-width="2.4" stroke-linejoin="round">
    <rect x="300" y="190" width="300" height="180" rx="78"/>
    <rect x="328" y="216" width="244" height="128" rx="56"/>
    <rect x="378" y="252" width="30" height="48" rx="15"/>
    <rect x="492" y="252" width="30" height="48" rx="15"/>
    <path d="M430 314 q20 14 40 0"/>
    <rect x="432" y="370" width="36" height="34" rx="6"/>
    <rect x="360" y="396" width="180" height="140" rx="58"/>
    <rect x="330" y="420" width="36" height="86" rx="18" transform="rotate(14 348 463)"/>
    <rect x="534" y="420" width="36" height="86" rx="18" transform="rotate(-14 552 463)"/>
    <rect x="334" y="524" width="232" height="62" rx="31"/>
    <path d="M450 190 v-38"/>
    <circle cx="450" cy="138" r="13"/>
  </g>
  <g stroke="#7fb0ff" stroke-width="1.4" stroke-dasharray="10 6 2 6" opacity="0.8">
    <path d="M450 100 V620"/><path d="M260 280 H640"/>
  </g>
  <!-- dimensions front -->
  <g stroke="#cfe1ff" stroke-width="1.4" fill="none">
    <path d="M300 640 V600 M600 640 V600"/>
    <path d="M304 630 H596" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <path d="M680 125 H700 M680 586 H700"/>
    <path d="M690 129 V582" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <g font-family="ui-monospace, Consolas, monospace" fill="#cfe1ff" font-size="16">
    <text x="420" y="660">120 mm</text>
    <text x="704" y="360" transform="rotate(90 704 360)">186 mm</text>
    <text x="210" y="210">R 26</text>
    <path d="M250 214 L312 228" stroke="#cfe1ff" stroke-width="1.2"/>
    <text x="250" y="170">LED ANTENNA Ø10</text>
    <path d="M380 166 L438 140" stroke="#cfe1ff" stroke-width="1.2"/>
    <text x="300" y="104" font-size="20" font-weight="700" letter-spacing="3" fill="#ffffff">FRONT</text>
  </g>

  <!-- SIDE VIEW -->
  <g fill="none" stroke="#e9f1ff" stroke-width="2.4" stroke-linejoin="round">
    <rect x="890" y="190" width="160" height="180" rx="70"/>
    <path d="M1040 230 q14 50 0 100"/>
    <rect x="952" y="370" width="36" height="34" rx="6"/>
    <rect x="900" y="396" width="140" height="140" rx="58"/>
    <rect x="884" y="524" width="172" height="62" rx="31"/>
    <path d="M970 190 v-38"/>
    <circle cx="970" cy="138" r="13"/>
  </g>
  <g stroke="#7fb0ff" stroke-width="1.4" stroke-dasharray="10 6 2 6" opacity="0.8"><path d="M970 100 V620"/></g>
  <g stroke="#cfe1ff" stroke-width="1.4" fill="none">
    <path d="M884 640 V600 M1056 640 V600"/>
    <path d="M888 630 H1052" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <g font-family="ui-monospace, Consolas, monospace" fill="#cfe1ff" font-size="16">
    <text x="938" y="660">70 mm</text>
    <text x="1080" y="290">TILT ±15°</text>
    <path d="M1076 284 L1048 280" stroke="#cfe1ff" stroke-width="1.2"/>
    <text x="1080" y="470">SPEAKER 28 mm</text>
    <path d="M1076 464 L1040 460" stroke="#cfe1ff" stroke-width="1.2"/>
    <text x="890" y="104" font-size="20" font-weight="700" letter-spacing="3" fill="#ffffff">SIDE</text>
  </g>

  <!-- title block -->
  <g transform="translate(1040 690)">
    <rect width="320" height="80" fill="#0e1f3a" stroke="#cfe1ff" stroke-width="1.4"/>
    <path d="M0 40 H320 M200 40 V80" stroke="#cfe1ff" stroke-width="1"/>
    <g font-family="ui-monospace, Consolas, monospace" fill="#e9f1ff">
      <text x="14" y="27" font-size="15" font-weight="700" letter-spacing="2">WSS DEVLABS · TUAH</text>
      <text x="14" y="66" font-size="13">DESK COMPANION · REV A</text>
      <text x="214" y="66" font-size="13">SCALE 1:2</text>
    </g>
  </g>
</svg>
