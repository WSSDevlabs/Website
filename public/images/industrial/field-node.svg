<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">Concept render: Ladang, a solar-powered LoRa sensor node on a pole in an oil palm plantation</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec5ec"/>
      <stop offset="0.7" stop-color="#d8ecf5"/>
      <stop offset="1" stop-color="#f4e9cf"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa451"/>
      <stop offset="1" stop-color="#4c7a33"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7dbe0"/>
      <stop offset="0.4" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c0c8"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b737c"/>
      <stop offset="0.5" stop-color="#c3c9d0"/>
      <stop offset="1" stop-color="#5f676f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a4c8a"/>
      <stop offset="1" stop-color="#0f2348"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="chip" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14301c" flood-opacity="0.2"/></filter>
    <g id="palm">
      <rect x="-5" y="-10" width="10" height="120" fill="#4d3a26"/>
      <g fill="#3f7a3a">
        <path d="M0 -10 C-40 -30 -80 -20 -100 10 C-60 -5 -30 -5 0 -10Z"/>
        <path d="M0 -10 C40 -30 80 -20 100 10 C60 -5 30 -5 0 -10Z"/>
        <path d="M0 -10 C-20 -50 -60 -70 -80 -60 C-50 -45 -25 -30 0 -10Z"/>
        <path d="M0 -10 C20 -50 60 -70 80 -60 C50 -45 25 -30 0 -10Z"/>
        <path d="M0 -10 C-5 -50 5 -80 10 -90 C12 -60 8 -35 0 -10Z"/>
      </g>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="660" cy="110" r="46" fill="#fff3c4"/>
  <circle cx="660" cy="110" r="70" fill="#fff3c4" opacity="0.35"/>

  <g opacity="0.55"><use href="#palm" x="90" y="330" transform="scale(1)"/><use href="#palm" x="240" y="345"/><use href="#palm" x="560" y="340"/><use href="#palm" x="720" y="335"/></g>
  <path d="M0 420 Q200 400 400 415 T800 410 V600 H0Z" fill="url(#ground)"/>
  <g stroke="#5f8f3f" stroke-width="3" fill="none" opacity="0.6">
    <path d="M0 470 Q400 440 800 470"/><path d="M0 520 Q400 490 800 520"/><path d="M0 570 Q400 545 800 570"/>
  </g>

  <ellipse cx="400" cy="520" rx="70" ry="10" fill="#000" opacity="0.25" filter="url(#blur)"/>
  <!-- pole -->
  <rect x="391" y="210" width="18" height="310" rx="4" fill="url(#pole)"/>

  <!-- solar panel -->
  <g transform="rotate(-18 400 170)">
    <rect x="300" y="150" width="200" height="104" rx="6" fill="#d9dee4"/>
    <rect x="308" y="158" width="184" height="88" rx="3" fill="url(#panel)"/>
    <g stroke="#6f8fc9" stroke-width="1.4" opacity="0.6">
      <path d="M354 158 v88 M400 158 v88 M446 158 v88 M308 188 h184 M308 217 h184"/>
    </g>
    <path d="M318 166 l60 0 l-30 40z" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- antenna -->
  <rect x="452" y="250" width="6" height="90" rx="3" fill="#2a2f35"/>
  <circle cx="455" cy="248" r="6" fill="#2a2f35"/>
  <g stroke="#2a9fd8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M472 236 a24 24 0 0 1 0 26"/><path d="M484 226 a40 40 0 0 1 0 46"/>
  </g>

  <!-- enclosure -->
  <rect x="330" y="300" width="140" height="120" rx="14" fill="url(#box)"/>
  <rect x="330" y="300" width="140" height="18" rx="9" fill="#e8553f"/>
  <rect x="348" y="334" width="104" height="44" rx="8" fill="#1a1f24"/>
  <text x="400" y="362" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#8ff0a8">pH 6.4</text>
  <circle cx="356" cy="398" r="5" fill="#2ecc8f" filter="url(#glow)"/>
  <circle cx="356" cy="398" r="4" fill="#7af0b0"/>
  <g fill="#9aa3ae"><circle cx="440" cy="398" r="3"/><circle cx="452" cy="398" r="3"/></g>
  <!-- cable into the soil -->
  <path d="M370 420 C368 470 380 490 372 520" stroke="#2a2f35" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- chips -->
  <g filter="url(#chip)">
    <rect x="530" y="250" width="200" height="52" rx="26" fill="#ffffff"/>
    <text x="556" y="282" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16211a">LoRa · 8 km range</text>
  </g>
  <g filter="url(#chip)">
    <rect x="70" y="220" width="190" height="46" rx="23" fill="#16211a"/>
    <text x="94" y="249" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Solar · IP67 · no wiring</text>
  </g>

  <text x="40" y="565" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#ffffff" opacity="0.9">CONCEPT 04 · LADANG FIELD NODE</text>
</svg>
