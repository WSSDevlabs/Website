<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">Concept render: Sayong, a table lamp shaped like a labu sayong clay gourd, with glowing pucuk rebung cut-outs</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1714"/>
      <stop offset="1" stop-color="#33241c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb35c" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff8a3d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffbf6b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffbf6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3b28"/>
      <stop offset="1" stop-color="#3a2618"/>
    </linearGradient>
    <radialGradient id="clay" cx="0.36" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#4a3329"/>
      <stop offset="0.45" stop-color="#241812"/>
      <stop offset="1" stop-color="#120b08"/>
    </radialGradient>
    <linearGradient id="teak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e3a1f"/>
      <stop offset="0.45" stop-color="#a06a3c"/>
      <stop offset="1" stop-color="#5a371d"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a2a"/>
      <stop offset="0.5" stop-color="#e4c46e"/>
      <stop offset="1" stop-color="#8a6a2a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="chip" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter>
    <clipPath id="bulb"><circle cx="400" cy="352" r="122"/></clipPath>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- faint songket lattice on the wall -->
  <g stroke="#c9a14a" stroke-width="1" fill="none" opacity="0.07">
    <path d="M0 60 L60 0 L120 60 L60 120Z M120 60 L180 0 L240 60 L180 120Z M560 60 L620 0 L680 60 L620 120Z M680 60 L740 0 L800 60 L740 120Z M0 180 L60 120 L120 180 L60 240Z M680 180 L740 120 L800 180 L740 240Z"/>
  </g>
  <circle cx="400" cy="330" r="290" fill="url(#halo)"/>

  <rect y="470" width="800" height="130" fill="url(#table)"/>
  <rect y="470" width="800" height="3" fill="#7a5238"/>
  <ellipse cx="400" cy="492" rx="300" ry="34" fill="url(#pool)"/>

  <!-- teak ring stand -->
  <ellipse cx="400" cy="486" rx="120" ry="15" fill="#000" opacity="0.45" filter="url(#soft)"/>
  <path d="M300 452 h200 l-14 30 h-172z" fill="url(#teak)"/>
  <ellipse cx="400" cy="452" rx="100" ry="12" fill="#b07a48"/>
  <g fill="#e4c46e" opacity="0.8">
    <path d="M330 462 l8 12 l8 -12z"/><path d="M356 462 l8 12 l8 -12z"/><path d="M382 462 l8 12 l8 -12z"/>
    <path d="M408 462 l8 12 l8 -12z"/><path d="M434 462 l8 12 l8 -12z"/><path d="M460 462 l8 12 l8 -12z"/>
  </g>

  <!-- gourd body: bulb + neck -->
  <path d="M372 238 C372 200 380 170 384 128 L416 128 C420 170 428 200 428 238 Z" fill="url(#clay)"/>
  <circle cx="400" cy="352" r="122" fill="url(#clay)"/>
  <!-- glowing pucuk rebung band -->
  <g clip-path="url(#bulb)">
    <g fill="#ffcf7a" filter="url(#glow)" opacity="0.9">
      <path d="M282 372 l18 -46 l18 46z"/><path d="M318 372 l18 -46 l18 46z"/><path d="M354 372 l18 -46 l18 46z"/>
      <path d="M390 372 l18 -46 l18 46z"/><path d="M426 372 l18 -46 l18 46z"/><path d="M462 372 l18 -46 l18 46z"/>
    </g>
    <g fill="#ffe2a8">
      <path d="M288 368 l12 -32 l12 32z"/><path d="M324 368 l12 -32 l12 32z"/><path d="M360 368 l12 -32 l12 32z"/>
      <path d="M396 368 l12 -32 l12 32z"/><path d="M432 368 l12 -32 l12 32z"/><path d="M468 368 l12 -32 l12 32z"/>
    </g>
    <g fill="#ffcf7a">
      <circle cx="300" cy="392" r="3.5"/><circle cx="336" cy="392" r="3.5"/><circle cx="372" cy="392" r="3.5"/>
      <circle cx="408" cy="392" r="3.5"/><circle cx="444" cy="392" r="3.5"/><circle cx="480" cy="392" r="3.5"/>
      <circle cx="318" cy="308" r="3"/><circle cx="354" cy="308" r="3"/><circle cx="390" cy="308" r="3"/>
      <circle cx="426" cy="308" r="3"/><circle cx="462" cy="308" r="3"/>
    </g>
    <path d="M276 318 H524 M276 400 H524" stroke="#e4c46e" stroke-width="2" opacity="0.55"/>
  </g>
  <!-- clay highlight -->
  <path d="M318 290 q30 -40 78 -46" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.08"/>
  <!-- brass collar + mouth -->
  <rect x="380" y="226" width="40" height="12" rx="3" fill="url(#brass)"/>
  <path d="M376 118 q24 -16 48 0 l-6 12 h-36z" fill="url(#brass)"/>
  <ellipse cx="400" cy="116" rx="24" ry="5" fill="#ffe2a8" filter="url(#glow)"/>

  <!-- chips -->
  <g filter="url(#chip)">
    <rect x="556" y="170" width="208" height="52" rx="26" fill="#fff7ea"/>
    <circle cx="588" cy="196" r="9" fill="#ffb35c"/>
    <text x="606" y="202" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#2a1d15">Warm dim · 2700K</text>
  </g>
  <g filter="url(#chip)">
    <rect x="50" y="250" width="182" height="46" rx="23" fill="#2a1d15" stroke="#e4c46e" stroke-opacity="0.4"/>
    <text x="74" y="279" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffe2a8">Touch + app control</text>
  </g>

  <text x="40" y="565" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#ffe2a8" opacity="0.8">CONCEPT 02 · SAYONG HERITAGE LAMP</text>
</svg>
