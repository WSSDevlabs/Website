<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">Concept render: Tunas, a self-watering smart planter with a soil sensor and a small screen showing moisture level</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4ec"/>
      <stop offset="1" stop-color="#dbe7d8"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f3ee"/>
      <stop offset="1" stop-color="#e2ddd4"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c3b8"/>
      <stop offset="0.35" stop-color="#f5f2ec"/>
      <stop offset="1" stop-color="#bdb6aa"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fb06b"/>
      <stop offset="1" stop-color="#1f6b3c"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc985"/>
      <stop offset="1" stop-color="#2a7a47"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd3ff"/>
      <stop offset="1" stop-color="#2a9fd8"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="chip" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1b3320" flood-opacity="0.15"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="560" y="60" width="180" height="250" rx="16" fill="#ffffff" opacity="0.5"/>
  <rect x="580" y="80" width="140" height="210" rx="10" fill="#cfe3f1" opacity="0.6"/>
  <rect y="460" width="800" height="140" fill="url(#shelf)"/>
  <rect y="460" width="800" height="3" fill="#ffffff"/>

  <ellipse cx="400" cy="474" rx="140" ry="14" fill="#000" opacity="0.2" filter="url(#blur)"/>

  <!-- leaves -->
  <path d="M400 290 C330 250 280 170 300 110 C360 140 400 210 400 290Z" fill="url(#leaf)"/>
  <path d="M400 290 C470 240 540 200 560 130 C490 130 420 200 400 290Z" fill="url(#leaf2)"/>
  <path d="M400 290 C390 210 410 130 450 80 C470 150 440 230 400 290Z" fill="url(#leaf)"/>
  <path d="M400 290 C340 270 270 260 230 220 C290 200 360 230 400 290Z" fill="url(#leaf2)"/>
  <path d="M400 290 C450 280 520 290 570 260 C520 230 450 250 400 290Z" fill="url(#leaf)"/>
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M400 290 C370 220 330 160 305 118"/>
    <path d="M400 290 C450 230 500 180 552 136"/>
    <path d="M400 290 C405 210 425 140 448 90"/>
  </g>

  <!-- pot -->
  <path d="M300 290 h200 l-22 176 a10 10 0 0 1 -10 9 h-136 a10 10 0 0 1 -10 -9z" fill="url(#pot)"/>
  <rect x="292" y="282" width="216" height="22" rx="11" fill="#ece8e1"/>
  <ellipse cx="400" cy="288" rx="96" ry="7" fill="#4a3426"/>

  <!-- water window -->
  <rect x="442" y="330" width="22" height="110" rx="11" fill="#d7e6ee"/>
  <rect x="442" y="380" width="22" height="60" rx="11" fill="url(#water)"/>
  <path d="M446 374 h14" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- display -->
  <rect x="336" y="336" width="88" height="62" rx="12" fill="#1a1f1b"/>
  <text x="380" y="368" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#8ff0a8">62%</text>
  <text x="380" y="387" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#8ff0a8" opacity="0.7">MOISTURE</text>
  <circle cx="380" cy="420" r="5" fill="#2ecc8f"/>

  <!-- chips -->
  <g filter="url(#chip)">
    <rect x="70" y="150" width="190" height="52" rx="26" fill="#ffffff"/>
    <path d="M98 166 c6 8 10 13 10 18 a10 10 0 0 1 -20 0 c0 -5 4 -10 10 -18z" fill="#2a9fd8"/>
    <text x="118" y="182" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16211a">Water in 3 days</text>
  </g>
  <g filter="url(#chip)">
    <rect x="560" y="340" width="176" height="46" rx="23" fill="#16211a"/>
    <text x="582" y="369" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Light: good · 31°C</text>
  </g>

  <text x="40" y="565" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#5b6b5e" opacity="0.9">CONCEPT 03 · TUNAS SMART PLANTER</text>
</svg>
