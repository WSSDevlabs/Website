backend:
  name: github
  repo: WSSDevlabs/Website
  branch: main
  base_url: https://wss-cms-auth.wssdevlabs.workers.dev
  auth_endpoint: auth

# Shows a "draft, review, ready" workflow with previews before anything
# merges to main. Turn off (delete this line) if you want direct-to-main saves.
publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

locale: "en"

collections:
  # ---- Portfolio projects (src/content/projects/*.md) ----
  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Client", name: "client", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Web", "Mobile", "System", "AI"]
      - { label: "Headline Result", name: "headlineResult", widget: "string", hint: "One-line outcome, e.g. '40% faster checkout'" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Hero Image", name: "heroImage", widget: "image" }
      - { label: "Industry", name: "industry", widget: "string" }
      - { label: "Timeline", name: "timeline", widget: "string" }
      - { label: "Services Used", name: "services", widget: "list" }
      - { label: "Tech Stack", name: "techStack", widget: "list" }
      - label: "Results"
        name: "results"
        widget: "list"
        default: []
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Value", name: "value", widget: "string" }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        default: []
        field: { label: "Image", name: "image", widget: "image" }
      - label: "Testimonial"
        name: "testimonial"
        widget: "object"
        required: false
        collapsible: true
        fields:
          - { label: "Quote", name: "quote", widget: "text" }
          - { label: "Author", name: "author", widget: "string" }
          - { label: "Role", name: "role", widget: "string" }
      - { label: "Featured on Homepage", name: "featured", widget: "boolean", default: false }
      - { label: "Draft (hide from site)", name: "draft", widget: "boolean", default: true }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - { label: "Full Write-up", name: "body", widget: "markdown" }

  # ---- Blog / Insights posts (src/content/posts/*.md) ----
  - name: "posts"
    label: "Blog Posts"
    folder: "src/content/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Author (your name, shown as the byline)", name: "author", widget: "string", default: "Razali" }
      - label: "Call to action (which offer this article points to)"
        name: "cta"
        widget: "select"
        options: ["websites", "systems", "custom"]
        required: false
      - { label: "Cover Image", name: "coverImage", widget: "image" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Draft (hide from site)", name: "draft", widget: "boolean", default: true }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Source link (optional)", name: "sourceUrl", widget: "string", required: false }
      - { label: "Source name (optional)", name: "sourceLabel", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # Prices, packages, systems and FAQs live in code (src/data/catalog.ts, systems.ts,
  # faqs.ts) so a price can never contradict itself. Ask your developer to change them.

  # ---- Team members (src/data/team.json) ----
  - name: "team"
    label: "Team"
    files:
      - name: "team"
        label: "Team Members"
        file: "src/data/team.json"
        fields:
          - label: "Members"
            name: "members"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Slug (used in the URL, no spaces)", name: "slug", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Credentials", name: "credentials", widget: "string", required: false }
              - { label: "Skills", name: "skills", widget: "list", required: false }
              - label: "Social Links"
                name: "social"
                widget: "object"
                required: false
                collapsible: true
                fields:
                  - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
                  - { label: "TikTok", name: "tiktok", widget: "string", required: false }
                  - { label: "Instagram", name: "instagram", widget: "string", required: false }
                  - { label: "Twitter / X", name: "twitter", widget: "string", required: false }

  # ---- Partner / client logos (src/data/partners.json) ----
  - name: "partners"
    label: "Partner & Client Logos"
    files:
      - name: "partners"
        label: "Partner & Client Logos"
        file: "src/data/partners.json"
        fields:
          - label: "Partners (real clients only, with written permission to show their logo)"
            name: "partners"
            widget: "list"
            default: []
            summary: "{{name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image" }

  # ---- Site-wide settings (src/data/site.json) ----
  - name: "site"
    label: "Site Settings"
    files:
      - name: "site"
        label: "Company Info"
        file: "src/data/site.json"
        fields:
          - { label: "Company Name", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Registered name (exactly as on your SSM certificate)", name: "legalName", widget: "string", required: false }
          - { label: "SSM registration number", name: "ssmNumber", widget: "string", required: false }
          - { label: "SST Number (only once registered)", name: "sstNumber", widget: "string", required: false }
          - { label: "Registered address (a virtual office is fine if labelled honestly)", name: "registeredAddress", widget: "string", required: false }
          - { label: "Based in (city, shown when no registered address is set)", name: "baseLocation", widget: "string" }
          - { label: "Meetings line", name: "meetings", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Privacy email", name: "privacyEmail", widget: "string" }
          - { label: "Privacy contact (name and role)", name: "privacyContact", widget: "string" }
          - { label: "WhatsApp Number (country code and digits only, e.g. 601127205895)", name: "whatsapp", widget: "string" }
          - { label: "Phone (display format)", name: "phone", widget: "string" }
          - { label: "Business Hours", name: "hours", widget: "string" }
          - { label: "Year founded", name: "foundedYear", widget: "string", required: false }
          - { label: "Founding Client places left (update every time one is taken)", name: "foundingSlotsLeft", widget: "number", value_type: "int", min: 0, max: 5 }
          - { label: "Your mobile PageSpeed score (e.g. 96, shown only when set)", name: "pageSpeedMobile", widget: "string", required: false }
          - { label: "Google Business Profile link", name: "googleBusinessProfileUrl", widget: "string", required: false }
          - label: "Social Links (leave blank to hide; only accounts you post on)"
            name: "social"
            widget: "object"
            fields:
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "TikTok", name: "tiktok", widget: "string", required: false }
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
