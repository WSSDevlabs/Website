backend:
  name: github
  repo: WSSDevlabs/Website
  branch: main
  base_url: https://wss-cms-auth.wssdevlabs.workers.dev
  auth_endpoint: auth

# Shows a "draft, review, ready" workflow with previews before anything
# merges to main. Turn off (delete this line) if you want direct-to-main saves.
publish_mode: editorial_workflow

media_folder: "public/uploads"
public_folder: "/uploads"

locale: "en"

collections:
  # ---- Case studies (src/content/case-studies/*.md) ----
  # Only entries with Draft OFF and written permission ON appear on the site.
  - name: "caseStudies"
    label: "Case Studies"
    folder: "src/content/case-studies"
    create: true
    slug: "{{slug}}"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Client (name, or e.g. 'Retail chain, Selangor')", name: "client", widget: "string" }
      - { label: "Industry", name: "industry", widget: "string" }
      - label: "Which offer"
        name: "offer"
        widget: "select"
        options: ["websites", "systems", "custom"]
      - { label: "The problem, in the client's words (2 to 3 sentences)", name: "problem", widget: "text" }
      - { label: "What we built", name: "built", widget: "text" }
      - { label: "Result, as a number (e.g. 'Saves 6 hours a week')", name: "result", widget: "string" }
      - label: "Screenshots (sample data only)"
        name: "screenshots"
        widget: "list"
        required: false
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Description (alt text)", name: "alt", widget: "string" }
      - label: "Client quote"
        name: "quote"
        widget: "object"
        required: false
        fields:
          - { label: "Quote (max 3 lines)", name: "text", widget: "text" }
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Role", name: "role", widget: "string" }
      - { label: "Written permission to publish is on file", name: "permissionOnFile", widget: "boolean", default: false }
      - { label: "Draft (hide from site)", name: "draft", widget: "boolean", default: true }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - { label: "Notes (not shown on site)", name: "body", widget: "markdown", required: false }

  # ---- Insights articles (src/content/posts/*.md) ----
  - name: "posts"
    label: "Insights"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Author (team member slug)", name: "author", widget: "string", default: "razali" }
      - { label: "Cover Image", name: "coverImage", widget: "image" }
      - { label: "Cover image description (leave empty if purely decorative)", name: "coverAlt", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - label: "Closing call to action points to"
        name: "cta"
        widget: "select"
        options: ["websites", "systems", "custom"]
        default: "websites"
      - { label: "Draft (hide from site)", name: "draft", widget: "boolean", default: true }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Main source URL", name: "sourceUrl", widget: "string", required: false }
      - { label: "Main source label", name: "sourceLabel", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # ---- Client reviews (src/data/testimonials.json) ----
  # Real reviews only, with written permission. Never write reviews yourself.
  - name: "testimonials"
    label: "Client Reviews"
    files:
      - name: "testimonials"
        label: "Client Reviews"
        file: "src/data/testimonials.json"
        fields:
          - label: "Reviews"
            name: "testimonials"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Quote (max 3 lines, never edited to change meaning)", name: "quote", widget: "text" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Company", name: "company", widget: "string", required: false }
              - { label: "Where it was posted (e.g. Google)", name: "source", widget: "string", required: false }
              - { label: "Written permission to publish is on file", name: "permissionOnFile", widget: "boolean", default: false }

  # ---- Founder and team (src/data/team.json) ----
  - name: "team"
    label: "Founder & Team"
    files:
      - name: "team"
        label: "Team Members"
        file: "src/data/team.json"
        fields:
          - label: "Members"
            name: "members"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Slug (no spaces)", name: "slug", widget: "string" }
              - { label: "First name", name: "name", widget: "string" }
              - { label: "Full name", name: "fullName", widget: "string", required: false }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Photo (a real photo)", name: "photo", widget: "image", required: false }
              - { label: "Short bio (first person)", name: "bio", widget: "text" }
              - { label: "Years of experience", name: "yearsExperience", widget: "string", required: false }
              - { label: "Notable things built (2 or 3)", name: "notable", widget: "list", required: false }
              - label: "Social Links"
                name: "social"
                widget: "object"
                required: false
                collapsible: true
                fields:
                  - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
                  - { label: "TikTok", name: "tiktok", widget: "string", required: false }
                  - { label: "Instagram", name: "instagram", widget: "string", required: false }

  # ---- Company settings (src/data/site.json) ----
  - name: "site"
    label: "Company Settings"
    files:
      - name: "site"
        label: "Company Info"
        file: "src/data/site.json"
        fields:
          - { label: "Brand name", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Registered name (exactly as on SSM)", name: "legalName", widget: "string", required: false }
          - { label: "SSM registration number", name: "ssmNumber", widget: "string", required: false }
          - { label: "SST number (only if registered)", name: "sstNumber", widget: "string", required: false }
          - { label: "Registered address (full)", name: "registeredAddress", widget: "string", required: false }
          - { label: "Based in (shown until the address is set)", name: "baseLocation", widget: "string" }
          - { label: "Meetings", name: "meetings", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Privacy contact email", name: "privacyEmail", widget: "string" }
          - { label: "Privacy contact person", name: "privacyContact", widget: "string" }
          - { label: "WhatsApp number (country code and digits only, e.g. 601127205895)", name: "whatsapp", widget: "string" }
          - { label: "Phone (display format)", name: "phone", widget: "string" }
          - { label: "Business hours", name: "hours", widget: "string" }
          - { label: "Founded year", name: "foundedYear", widget: "string", required: false }
          - { label: "Founding Client places left (0 to 5)", name: "foundingSlotsLeft", widget: "number", value_type: "int", min: 0, max: 5 }
          - { label: "Our latest PageSpeed mobile score (leave empty until measured)", name: "pageSpeedMobile", widget: "string", required: false }
          - { label: "Google Business Profile URL", name: "googleBusinessProfileUrl", widget: "string", required: false }
          - label: "Social links (only accounts you actually post on)"
            name: "social"
            widget: "object"
            fields:
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "TikTok", name: "tiktok", widget: "string", required: false }
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
